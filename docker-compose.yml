services:
  wishes:
    build: .
    image: wishes:latest
    container_name: wishes
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      TZ: America/New_York
      APP_URL: http://localhost:3000
      # ALLOW_SIGNUP: "false"
      # OIDC_ISSUER: https://auth.example.com
      # OIDC_CLIENT_ID: wishes
      # OIDC_CLIENT_SECRET: change-me
      # OIDC_NAME: Tinyauth
      # FLARESOLVERR_URL: http://flaresolverr:8191

  # Optional: lets Wishes read store pages that show a "checking your browser" wall.
  # flaresolverr:
  #   image: ghcr.io/flaresolverr/flaresolverr:latest
  #   container_name: flaresolverr
  #   restart: unless-stopped
